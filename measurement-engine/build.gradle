// Standalone Kotlin measurement engine. Deliberately free of React Native
// dependencies so it can be unit-tested and reused independently of the UI.
apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.adinn.recce.measurement"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }
}

dependencies {
    // Spatial tracking (SLAM / VIO, camera pose, hit-testing, Depth API)
    implementation("com.google.ar:core:1.56.0")

    // Camera pipeline
    implementation("androidx.camera:camera-core:1.6.2")
    implementation("androidx.camera:camera-camera2:1.6.2")
    implementation("androidx.camera:camera-lifecycle:1.6.2")

    testImplementation("junit:junit:4.13.2")
}
